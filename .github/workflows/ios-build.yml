name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        run: |
          cd ios-pavte
          xcodegen generate
      
      - name: Build iOS app
        run: |
          cd ios-pavte
          set -o pipefail
          xcodebuild -project Pavte.xcodeproj -scheme Pavte -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro' build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -30
      
      - name: Check build result
        if: always()
        run: |
          cd ios-pavte
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "✅ Build succeeded!"
          else
            echo "❌ Build failed!"
            grep -E "error:" build.log | head -30 || true
            exit 1
          fi
