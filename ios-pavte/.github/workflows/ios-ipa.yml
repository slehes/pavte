name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest available Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          fi
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Available iOS SDKs ==="
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen 2>/dev/null || true
          xcodegen --version

      - name: Generate Xcode project with XcodeGen
        working-directory: ios-pavte
        run: |
          xcodegen generate
          echo "Project generated with XcodeGen"

      - name: Build archive
        working-directory: ios-pavte
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Pavte.xcodeproj \
            -scheme Pavte \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Pavte.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log | tail -50

      - name: Show build errors on failure
        if: failure()
        working-directory: ios-pavte
        run: |
          echo "=== BUILD FAILED ==="
          grep -i "error:" build.log | head -30 || true
          echo "=== Last 80 lines ==="
          tail -80 build.log || true

      - name: Package unsigned IPA artifact
        working-directory: ios-pavte
        run: |
          mkdir -p build/Payload
          if [ -d "build/Pavte.xcarchive/Products/Applications/Pavte.app" ]; then
            cp -R build/Pavte.xcarchive/Products/Applications/Pavte.app build/Payload/
            cd build
            zip -qry Pavte-unsigned.ipa Payload
            echo "IPA created successfully"
            ls -lh Pavte-unsigned.ipa
          else
            echo "ERROR: Pavte.app not found in archive"
            find build/Pavte.xcarchive -type f 2>/dev/null | head -30 || true
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pavte-unsigned-ipa
          path: ios-pavte/build/Pavte-unsigned.ipa
          retention-days: 14
