name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications/ | grep Xcode || true

      - name: Select latest available Xcode
        run: |
          # Try to find the latest Xcode version available on the runner
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            echo "Using default Xcode"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Generate Xcode project
        working-directory: ios-pavte
        run: |
          # Generate project using swift package or create manually
          # First check if project.pbxproj exists and is valid
          if [ ! -f "Pavte.xcodeproj/project.pbxproj" ] || [ ! -s "Pavte.xcodeproj/project.pbxproj" ]; then
            echo "Generating Xcode project..."
            # We'll use xcodegen if available, otherwise create inline
            if command -v xcodegen &> /dev/null; then
              xcodegen generate
            else
              # Install xcodegen
              brew install xcodegen 2>/dev/null || true
              if command -v xcodegen &> /dev/null; then
                xcodegen generate
              else
                echo "xcodegen not available, will create project spec"
              fi
            fi
          fi

      - name: Create XcodeGen spec
        working-directory: ios-pavte
        run: |
          cat > project.yml << 'SPECEOF'
          name: Pavte
          options:
            bundleIdPrefix: com.pavte
            deploymentTarget:
              iOS: "18.0"
            xcodeVersion: "16.0"
            createIntermediateGroups: true
          settings:
            base:
              SWIFT_VERSION: "6.0"
              IPHONEOS_DEPLOYMENT_TARGET: "18.0"
          targets:
            Pavte:
              type: application
              platform: iOS
              sources:
                - Pavte
              settings:
                base:
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
                  INFOPLIST_KEY_CFBundleDisplayName: "Pavte"
                  PRODUCT_BUNDLE_IDENTIFIER: com.pavte.app
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
                  SWIFT_EMIT_LOC_STRINGS: YES
                  GENERATE_INFOPLIST_FILE: YES
              info:
                path: Info.plist
                properties:
                  CFBundleDevelopmentRegion: ru
                  CFBundleDisplayName: Pavte
                  CFBundleExecutable: $(EXECUTABLE_NAME)
                  CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                  CFBundleInfoDictionaryVersion: "6.0"
                  CFBundleName: $(PRODUCT_NAME)
                  CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  LSRequiresIPhoneOS: true
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                    UISceneConfigurations: {}
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
          SPECEOF

      - name: Install XcodeGen and generate project
        working-directory: ios-pavte
        run: |
          brew install xcodegen 2>/dev/null || true
          if command -v xcodegen &> /dev/null; then
            xcodegen generate
            echo "XcodeGen project created successfully"
          else
            echo "XcodeGen installation failed, trying mint..."
            brew install mint 2>/dev/null || true
            if command -v mint &> /dev/null; then
              mint run yonaskolb/xcodegen xcodegen generate
            fi
          fi

      - name: Build archive
        working-directory: ios-pavte
        run: |
          # Determine the iOS SDK to use
          IOS_SDK=$(xcodebuild -showsdks 2>/dev/null | grep -oE 'iphoneos[0-9.]+' | head -1)
          if [ -z "$IOS_SDK" ]; then
            IOS_SDK="iphoneos"
          fi
          echo "Using iOS SDK: $IOS_SDK"

          xcodebuild archive \
            -project Pavte.xcodeproj \
            -scheme Pavte \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Pavte.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty || xcodebuild archive \
            -project Pavte.xcodeproj \
            -scheme Pavte \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Pavte.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA artifact
        working-directory: ios-pavte
        run: |
          mkdir -p build/Payload
          cp -R build/Pavte.xcarchive/Products/Applications/Pavte.app build/Payload/
          cd build
          zip -qry Pavte-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pavte-unsigned-ipa
          path: ios-pavte/build/Pavte-unsigned.ipa
          retention-days: 14
